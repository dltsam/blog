title: 纸边集
description: GIS、前端工程与问题复盘。把地图、数据和界面之间的细节写清楚。
url: https://dltsam.github.io
baseurl: "/blog"
lang: zh-CN
timezone: Asia/Shanghai
permalink: /journal/:year/:month/:day/:title/
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
