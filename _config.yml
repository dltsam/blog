title: 纸边集
description: 把日常里值得记住的事，慢慢写下来。
url: https://dltsam.github.io
baseurl: "/blog"
lang: zh-CN
timezone: Asia/Shanghai
permalink: /journal/:year/:month/:day/:title/
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
